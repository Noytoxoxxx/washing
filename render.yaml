services:
  - type: web
    name: veyza-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev is required: NODE_ENV=production below also applies during the build phase,
    # and npm otherwise skips devDependencies (typescript, @types/*) under NODE_ENV=production —
    # breaking the tsc build with confusing "cannot find declaration for express" errors.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veyza-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Set this manually in the Render dashboard once the Vercel project exists —
      # it must be the exact production URL the browser loads (used for CORS + cookies).
      - key: CLIENT_URL
        sync: false

databases:
  - name: veyza-db
    plan: free
